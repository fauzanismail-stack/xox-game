<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XOX ARENA 🔥</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
</div>

<div class="container">

    <header>
        <div class="logo">❌⭕❌</div>

        <h1>XOX ARENA</h1>

        <p class="subtitle">
            JANGAN SAMPE KALAH!
        </p>
    </header>


    <!-- MODE -->

    <div class="mode-box">

        <button id="playerMode" class="mode active">
            👥 2 PLAYER
        </button>

        <button id="aiMode" class="mode">
            🤖 LAWAN AI
        </button>

    </div>


    <!-- SCORE -->

    <section class="score-board">

        <div class="player x-player">

            <span>❌</span>

            <p id="nameX">
                Player X
            </p>

            <strong id="scoreX">
                0
            </strong>

        </div>


        <div class="vs">
            VS
        </div>


        <div class="player o-player">

            <span>⭕</span>

            <p id="nameO">
                Player O
            </p>

            <strong id="scoreO">
                0
            </strong>

        </div>

    </section>


    <div class="status" id="status">
        Giliran ❌
    </div>


    <!-- GAME -->

    <main class="game-board">

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

    </main>


    <!-- BUTTON -->

    <div class="buttons">

        <button class="reset-button" id="resetButton">
            🔄 Ulang
        </button>

        <button class="reset-button" id="soundButton">
            🔊 Sound ON
        </button>

    </div>


    <!-- LEADERBOARD -->

    <div class="leaderboard">

        <h2>🏆 LEADERBOARD</h2>

        <div class="leader-row">

            <span>❌ X</span>

            <strong id="leaderX">
                0
            </strong>

        </div>

        <div class="leader-row">

            <span>⭕ O</span>

            <strong id="leaderO">
                0
            </strong>

        </div>

        <button id="clearLeaderboard">
            Reset Leaderboard
        </button>

    </div>


    <p class="footer">
        Buatan ojan & AI 🤖
    </p>

</div>


<!-- POPUP -->

<div class="win-popup" id="winPopup">

    <div class="popup-box">

        <div class="confetti">
            🎉
        </div>

        <h2 id="winnerText">
            Player X Menang
        </h2>

        <p id="popupMessage">
            keren Permainan selesai 🔥
        </p>

        <button id="nextButton">
            Lanjutin 🔥
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
