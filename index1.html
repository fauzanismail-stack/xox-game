<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XOX ARENA🔥</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="floating">🌟</div>
        <div class="floating">🏆</div>
        <div class="floating">🏅</div>
        <div class="floating">🎮</div>

        <header>
            <div class="logo">❌⭕❌</div>

            <h1>!XOX RUSH!</h1>

            <p class="subtitle">
                JANGAN SAMPE KALAH!
            </p>
        </header>

        <section class="score-board">

            <div class="player x-player">
                <span>❌</span>
                <p>Player X</p>
                <strong id="scoreX">0</strong>
            </div>

            <div class="vs">
                VS
            </div>

            <div class="player o-player">
                <span>⭕</span>
                <p>Player O</p>
                <strong id="scoreO">0</strong>
            </div>

        </section>

        <div class="status" id="status">
            Giliran ❌
        </div>

        <main class="game-board" id="gameBoard">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </main>

        <button class="reset-button" id="resetButton">
            🔄 Ulang lagi
        </button>

        <p class="footer">
            Buatan ojan & AI 
        </p>

    </div>

    <div class="win-popup" id="winPopup">

        <div class="popup-box">

            <div class="confetti">🎉</div>

            <h2 id="winnerText">
                Player X Menang!
            </h2>

            <p>
                YEAYY KAMU MENANG🏆
            </p>

            <button id="nextButton">
                Lanjutin dong 
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
